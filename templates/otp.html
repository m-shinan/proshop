<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Verify OTP</h3>
                    </div>
                    <div class="card-body">
                        <form id="otpForm">
                            <div class="mb-3">
                                <label for="otpEmail" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="otpEmail" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="otpCode" class="form-label">OTP Code</label>
                                <input type="text" class="form-control" id="otpCode" name="otp" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('otpForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            fetch('/user/verify-otp', {
                method: 'POST',
                body: formData
            }).then(response => response.json())
              .then(data => {
                  if (data.message) {
                      alert(data.message);  // Display the popup message
                      setTimeout(() => {
                          window.location.href = '/user/login';  // Redirect to login page after OK button is pressed
                      }, 2000); // Redirect after 2 seconds
                  } else {
                      alert('Error: ' + data.error);
                  }
              }).catch(error => {
                  console.error('Error:', error);
              });
        });
    </script>
</body>
</html>
