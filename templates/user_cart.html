<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 56px; /* Adjust this value based on the height of your navbar */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">E-Commerce Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/user/userHome">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/user/wishlist">Wishlist</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">Shopping Cart</h1>
        <div id="cart-items">
            {{range .CartItems}}
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-2">
                        <img src="/{{.ImageFilename}}" class="img-fluid rounded-start" alt="{{.ProductName}}">
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title">{{.ProductName}}</h5>
                            <p class="card-text">Price: ₹{{.ProductPrice}}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="input-group" style="width: 120px;">
                                    <form action="/user/cart/minus/{{.ProductID}}" method="post" style="display: inline;">
                                        <button class="btn btn-outline-secondary decrease-qty" type="submit">-</button>
                                    </form>
                                    <input type="text" class="form-control text-center item-qty" value="{{.Quantity}}" readonly>
                                    <form action="/user/cart/plus/{{.ProductID}}" method="post" style="display: inline;">
                                        <button class="btn btn-outline-secondary increase-qty" type="submit">+</button>
                                    </form>
                                </div>
                                <p class="mb-0">Total: ₹<span class="item-total">{{.TotalPrice}}</span></p>
                                <form action="/user/cart/remove/{{.ProductID}}" method="post" style="display: inline;">
                                    <button class="btn btn-danger remove-item" type="submit">Remove</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
        <div class="row mt-4">
            <div class="col-md-6">
                <h4>Total: ₹<span id="cart-total">{{.CartTotal}}</span></h4>
            </div>
            <div class="col-md-6 text-end">
                <form action="/user/checkout" method="get">
                    <button type="submit" class="btn btn-primary">Checkout</button>
                </form>
            </div>
            
        </div>
    </div>
</body>
</html>
